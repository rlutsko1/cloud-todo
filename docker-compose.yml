services:
  postgres:
    image: postgres:17
    container_name: cloud-todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudtodo
      POSTGRES_USER: cloudtodo
      POSTGRES_PASSWORD: cloudtodo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-todo-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudtodo
      SPRING_DATASOURCE_USERNAME: cloudtodo
      SPRING_DATASOURCE_PASSWORD: cloudtodo_dev_password
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge