spring.application.name=cloud-todo-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudtodo?serverTimezone=UTC
spring.datasource.username=cloudtodo
spring.datasource.password=cloudtodo_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Key Auth
app.api-key=dev-secret-key-123

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html